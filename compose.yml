name: ageniza-local
services:
  postgres:
    image: postgres:17
    environment:
      # Disposable local credentials only; production reads them from a root-owned file on the VPS.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ageniza
      AGENIZA_APP_DB_PASSWORD: ageniza_app
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    # Loopback only, for host tools and tests; production removes this mapping.
    ports: ["127.0.0.1:54322:5432"]
    networks: [internal, database-host]
    # TCP check: the temporary server used during first initialisation listens only on a socket.
    healthcheck: { test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ageniza"], interval: 5s, timeout: 3s, retries: 12 }
  mailpit:
    # Local mail sink: messages are captured, never delivered. Web interface on 127.0.0.1:8025.
    image: axllent/mailpit:v1.21
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    # 8025 is the inbox; 1025 lets host tooling send a test message. Production excludes this service.
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
    networks: [internal, database-host]
    healthcheck: { test: ["CMD", "/mailpit", "readyz"], interval: 5s, timeout: 3s, retries: 12 }
  # Local S3-compatible object storage standing in for Cloudflare R2 (issue #21). Console on
  # 127.0.0.1:9001; the S3 API on 127.0.0.1:9000 is published only for host tools/tests, same as postgres.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-01-20T14-49-07Z
    environment:
      MINIO_ROOT_USER: ageniza-local
      MINIO_ROOT_PASSWORD: ageniza-local-secret
      # MinIO has no per-bucket CORS API (unlike R2/S3: `mc cors set` returns NotImplemented); CORS
      # is server-wide instead. MinIO always exposes ETag once CORS is enabled, which multipart needs.
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:5173
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    networks: [internal, database-host]
    healthcheck: { test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"], interval: 5s, timeout: 3s, retries: 12 }
  # One-shot: creates the local bucket and makes it private. Never runs in production; R2 buckets
  # (including their CORS rule and lifecycle policy) are configured by hand -- see
  # apps/api/src/modules/media/README.md.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-01-17T23-25-50Z
    depends_on: { minio: { condition: service_healthy } }
    networks: [internal]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 ageniza-local ageniza-local-secret &&
        mc mb --ignore-existing local/ageniza-media-local &&
        mc anonymous set none local/ageniza-media-local
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      APP_ENV: local
      APP_CONTAINER_LOCAL: 'true'
      BETTER_AUTH_SECRET: local-development-placeholder-secret-change-me
      APP_PUBLIC_URL: http://127.0.0.1:5173
      AUTH_TERMS_VERSION: '2026-01-01'
      AUTH_PRIVACY_VERSION: '2026-02-01'
      API_HOST: 0.0.0.0
      PORT: 3001
      API_CORS_ORIGINS: http://127.0.0.1:5173
      DATABASE_URL: postgresql://ageniza_app:ageniza_app@postgres:5432/ageniza
      SMTP_URL: smtp://mailpit:1025
      EMAIL_FROM: Ageniza <no-reply@ageniza.local>
      R2_ENDPOINT: http://minio:9000
      # The browser resolves this endpoint directly; "minio" only exists inside the Compose network.
      R2_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      R2_ACCESS_KEY_ID: ageniza-local
      R2_SECRET_ACCESS_KEY: ageniza-local-secret
      R2_BUCKET: ageniza-media-local
      R2_REGION: auto
      R2_FORCE_PATH_STYLE: 'true'
    depends_on: { postgres: { condition: service_healthy }, mailpit: { condition: service_healthy }, minio: { condition: service_healthy } }
    ports: ["127.0.0.1:3001:3001"]
    networks: [edge, internal]
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 5s, timeout: 3s, retries: 12 }
  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    environment:
      APP_ENV: local
      APP_CONTAINER_LOCAL: 'true'
      DATABASE_URL: postgresql://ageniza_app:ageniza_app@postgres:5432/ageniza
      SMTP_URL: smtp://mailpit:1025
      EMAIL_FROM: Ageniza <no-reply@ageniza.local>
      WORKER_HEALTH_HOST: 0.0.0.0
      WORKER_HEALTH_PORT: 3002
      # Video processing (issue #24): same bucket/credentials as the API (issue #21). The worker
      # downloads the confirmed original and uploads thumbnail/preview outputs directly.
      R2_ENDPOINT: http://minio:9000
      R2_ACCESS_KEY_ID: ageniza-local
      R2_SECRET_ACCESS_KEY: ageniza-local-secret
      R2_BUCKET: ageniza-media-local
      R2_REGION: auto
      R2_FORCE_PATH_STYLE: 'true'
    depends_on: { postgres: { condition: service_healthy }, mailpit: { condition: service_healthy }, minio: { condition: service_healthy } }
    networks: [internal, egress]
    # Docker's default 10s would SIGKILL a draining worker. The queue drains for up to 45s (apps/worker).
    stop_grace_period: 60s
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 5s, timeout: 3s, retries: 12 }
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: http://127.0.0.1:3001
        # Removed with the Supabase web client in issue #20.
        VITE_SUPABASE_URL: http://127.0.0.1:54321
        VITE_SUPABASE_ANON_KEY: local-container-placeholder
    ports: ["127.0.0.1:5173:8080"]
    networks: [edge]
    healthcheck: { test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"], interval: 5s, timeout: 3s, retries: 12 }
networks:
  edge: {}
  internal: { internal: true }
  # Docker cannot publish ports from a container attached only to internal networks.
  database-host: {}
  # Worker has no published ports; this separate network provides outbound access (for example email).
  egress: {}
volumes:
  postgres-data: {}
  minio-data: {}
