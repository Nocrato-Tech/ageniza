name: ageniza-local
services:
  postgres:
    image: postgres:17
    environment:
      # Disposable local credentials only; production reads them from a root-owned file on the VPS.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ageniza
      AGENIZA_APP_DB_PASSWORD: ageniza_app
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    # Loopback only, for host tools and tests; production removes this mapping.
    ports: ["127.0.0.1:54322:5432"]
    networks: [internal, database-host]
    # TCP check: the temporary server used during first initialisation listens only on a socket.
    healthcheck: { test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ageniza"], interval: 5s, timeout: 3s, retries: 12 }
  mailpit:
    # Local mail sink: messages are captured, never delivered. Web interface on 127.0.0.1:8025.
    image: axllent/mailpit:v1.21
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    # 8025 is the inbox; 1025 lets host tooling send a test message. Production excludes this service.
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
    networks: [internal, database-host]
    healthcheck: { test: ["CMD", "/mailpit", "readyz"], interval: 5s, timeout: 3s, retries: 12 }
  # Local S3-compatible object storage standing in for Cloudflare R2 (issue #21). LocalStack took
  # MinIO's place when MinIO's community images left every public registry -- see decisions.md.
  # The S3 API is published on 127.0.0.1:9000 so every existing R2_ENDPOINT keeps working; inside
  # the network the endpoint is http://localstack:4566.
  localstack:
    image: localstack/localstack:4.9
    environment:
      SERVICES: s3
      # LocalStack accepts any credential, so the init hook signs with the same pair the application
      # uses only for consistency. MinIO did reject a wrong key; that check is now unverifiable
      # locally -- see apps/api/src/modules/media/README.md.
      AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - localstack-data:/var/lib/localstack
      - ./infra/localstack/init-bucket.sh:/etc/localstack/init/ready.d/init-bucket.sh:ro
      # Identity storage (issue #100): a second bucket, separate from media's, created by its own
      # ready hook -- see apps/api/src/modules/identity-storage/README.md.
      - ./infra/localstack/init-identity-bucket.sh:/etc/localstack/init/ready.d/init-identity-bucket.sh:ro
    # No console port: MinIO had one on 9001; LocalStack has no local web UI to publish.
    ports: ["127.0.0.1:9000:4566"]
    networks: [internal, database-host]
    # Both markers are what makes `--wait` mean "both buckets exist": LocalStack reports healthy
    # before its ready hooks finish running.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:4566/_localstack/health && test -f /tmp/ageniza-bucket-ready && test -f /tmp/ageniza-identity-bucket-ready"]
      interval: 5s
      timeout: 3s
      # A cold CI runner boots this far slower than a warm laptop: start_period keeps those first
      # attempts from counting, and the retries then cover a genuinely stuck container.
      start_period: 60s
      retries: 60
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      APP_ENV: local
      APP_CONTAINER_LOCAL: 'true'
      BETTER_AUTH_SECRET: local-development-placeholder-secret-change-me
      APP_PUBLIC_URL: http://127.0.0.1:5173
      AUTH_TERMS_VERSION: '2026-01-01'
      AUTH_PRIVACY_VERSION: '2026-02-01'
      API_HOST: 0.0.0.0
      PORT: 3001
      API_CORS_ORIGINS: http://127.0.0.1:5173
      DATABASE_URL: postgresql://ageniza_app:ageniza_app@postgres:5432/ageniza
      SMTP_URL: smtp://mailpit:1025
      EMAIL_FROM: Ageniza <no-reply@ageniza.local>
      R2_ENDPOINT: http://localstack:4566
      # The browser resolves this endpoint directly; "localstack" only exists inside the Compose network.
      R2_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ageniza-media-local
      R2_REGION: auto
      R2_FORCE_PATH_STYLE: 'true'
      # Identity storage (issue #100): separate bucket from media, same LocalStack account locally
      # -- production uses a distinct R2 API token scoped only to this bucket.
      IDENTITY_STORAGE_ENDPOINT: http://localstack:4566
      IDENTITY_STORAGE_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      IDENTITY_STORAGE_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      IDENTITY_STORAGE_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      IDENTITY_STORAGE_BUCKET: ageniza-identity-local
      IDENTITY_STORAGE_REGION: auto
      IDENTITY_STORAGE_FORCE_PATH_STYLE: 'true'
    depends_on: { postgres: { condition: service_healthy }, mailpit: { condition: service_healthy }, localstack: { condition: service_healthy } }
    ports: ["127.0.0.1:3001:3001"]
    networks: [edge, internal]
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 5s, timeout: 3s, retries: 12 }
  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    environment:
      APP_ENV: local
      APP_CONTAINER_LOCAL: 'true'
      DATABASE_URL: postgresql://ageniza_app:ageniza_app@postgres:5432/ageniza
      SMTP_URL: smtp://mailpit:1025
      EMAIL_FROM: Ageniza <no-reply@ageniza.local>
      WORKER_HEALTH_HOST: 0.0.0.0
      WORKER_HEALTH_PORT: 3002
      # Video processing (issue #24): same bucket/credentials as the API (issue #21). The worker
      # downloads the confirmed original and uploads thumbnail/preview outputs directly.
      R2_ENDPOINT: http://localstack:4566
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ageniza-media-local
      R2_REGION: auto
      R2_FORCE_PATH_STYLE: 'true'
    depends_on: { postgres: { condition: service_healthy }, mailpit: { condition: service_healthy }, localstack: { condition: service_healthy } }
    networks: [internal, egress]
    # Docker's default 10s would SIGKILL a draining worker. The queue drains for up to 45s (apps/worker).
    stop_grace_period: 60s
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 5s, timeout: 3s, retries: 12 }
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: http://127.0.0.1:3001
    ports: ["127.0.0.1:5173:8080"]
    networks: [edge]
    healthcheck: { test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"], interval: 5s, timeout: 3s, retries: 12 }
networks:
  edge: {}
  internal: { internal: true }
  # Docker cannot publish ports from a container attached only to internal networks.
  database-host: {}
  # Worker has no published ports; this separate network provides outbound access (for example email).
  egress: {}
volumes:
  postgres-data: {}
  localstack-data: {}
