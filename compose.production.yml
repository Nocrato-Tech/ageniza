services:
  api:
    image: ${AGENIZA_API_IMAGE:?immutable API image reference required}
    build: !reset null
    environment: !reset {}
    extra_hosts: !reset []
    env_file: ${AGENIZA_RUNTIME_ENV_FILE:?server runtime env file required}
    ports: !reset []
  worker:
    image: ${AGENIZA_WORKER_IMAGE:?immutable worker image reference required}
    build: !reset null
    environment: !reset {}
    extra_hosts: !reset []
    env_file: ${AGENIZA_RUNTIME_ENV_FILE:?server runtime env file required}
  web:
    image: ${AGENIZA_WEB_IMAGE:?immutable web image reference required}
    build: !reset null
    environment: !reset {}
    ports: !reset []
