services:
  api:
    image: ${AGENIZA_API_IMAGE:?immutable API image reference required}
    build: !reset null
    environment: !reset {}
    extra_hosts: !reset []
    env_file:
      - path: ${AGENIZA_RUNTIME_ENV_FILE:?server runtime env file required}
        format: raw
    ports: !reset []
    restart: unless-stopped
    logging: &production-logging
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    depends_on: !override
      postgres:
        condition: service_healthy
    # Reached only by the web container's /api proxy, never from the tunnel network (ADR 0012).
    # `egress` is not internal: the API needs outbound access for SMTP and error reporting.
    networks: !override [production-private, egress]
  worker:
    image: ${AGENIZA_WORKER_IMAGE:?immutable worker image reference required}
    build: !reset null
    environment: !reset {}
    extra_hosts: !reset []
    env_file:
      - path: ${AGENIZA_RUNTIME_ENV_FILE:?server runtime env file required}
        format: raw
    depends_on: !override
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *production-logging
    # Outbound access for SMTP and error reporting; never reachable from the tunnel network.
    networks: !override [production-private, egress]
  web:
    image: ${AGENIZA_WEB_IMAGE:?immutable web image reference required}
    build: !reset null
    environment: !reset {}
    ports: !reset []
    restart: unless-stopped
    logging: *production-logging
    # The tunnel reaches this service as `web`; it proxies /api to the API on the private network.
    networks: !override [production-proxy, production-private]
  # Local-only mail sink. The profile keeps it out of the production model entirely, so a
  # hand-run `docker compose up` on the VPS cannot start a mail catcher.
  mailpit:
    profiles: ["local-only"]
    ports: !reset []
  # Local-only object storage stand-in (issue #21). Production uses Cloudflare R2, configured
  # entirely by the R2_* variables in runtime.env; the profile keeps LocalStack out of the
  # production model, exactly like mailpit above.
  localstack:
    profiles: ["local-only"]
    ports: !reset []
  postgres:
    image: ${AGENIZA_POSTGRES_IMAGE:?immutable PostgreSQL image reference required}
    environment: !reset {}
    env_file:
      - path: ${AGENIZA_POSTGRES_ENV_FILE:?PostgreSQL env file required}
        format: raw
    # Never publish PostgreSQL: Docker-published ports bypass the host firewall.
    ports: !reset []
    volumes: !override
      - postgres-data:/var/lib/postgresql/data
      - /opt/ageniza/postgres/initdb:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb
    restart: unless-stopped
    logging: *production-logging
    networks: !override [production-private]

networks:
  production-proxy:
    name: ageniza-production-proxy
    external: true
  production-private:
    internal: true
