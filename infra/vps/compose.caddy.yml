services:
  caddy:
    image: ${AGENIZA_CADDY_IMAGE:?immutable Caddy image reference required}
    environment:
      AGENIZA_DOMAIN: ${AGENIZA_DOMAIN:?public domain required}
      AGENIZA_ACME_EMAIL: ${AGENIZA_ACME_EMAIL:?ACME contact email required}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks: [production-proxy]
    volumes:
      - /etc/ageniza/caddy:/etc/caddy:ro
      # Persist issued certificates; losing them risks Let's Encrypt rate limits.
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  production-proxy:
    name: ageniza-production-proxy
    external: true

volumes:
  caddy-data: {}
  caddy-config: {}
