name: Mobile review

# Typecheck, lint and tests of the mobile app run in `CI / Quality gates`; the nginx and same-origin web guards run in
# `CI / Docker images`. What stays here is the export of the app against the dev API and the presentation build.
on:
  push:
    branches: ['codex/mobile-*']
    paths: ['apps/mobile/**', '.github/workflows/mobile-review.yml']
  pull_request:
    branches: ['develop']
    paths: ['apps/mobile/**', '.github/workflows/mobile-review.yml']

permissions:
  contents: read

concurrency:
  group: mobile-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ageniza/contracts build
      - run: pnpm --filter @ageniza/mobile exec expo export --platform all --output-dir launch-dist/review
        env:
          EXPO_PUBLIC_API_URL: https://dev.ageniza.com.br/api
      - name: Export and verify the complete demo-enabled mobile app
        run: pnpm --filter @ageniza/mobile build:presentation
        env:
          EXPO_PUBLIC_API_URL: https://dev.ageniza.com.br/api
