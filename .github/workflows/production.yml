name: Production release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# One production release at a time; a newer push replaces a release that is still pending.
concurrency:
  group: ${{ github.event_name == 'push' && 'production-main' || format('production-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release-path:
    name: Release path validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deploy:validate
      - run: pnpm test:scripts
      - name: Build release-equivalent API image without pushing
        run: docker build --build-arg APP_VERSION="${{ github.event.pull_request.head.sha }}" -f apps/api/Dockerfile .
      - name: Build release-equivalent worker image without pushing
        run: docker build --build-arg APP_VERSION="${{ github.event.pull_request.head.sha }}" -f apps/worker/Dockerfile .
      - name: Build release-equivalent web image without pushing
        run: >-
          docker build
          --build-arg VITE_API_BASE_URL=https://app.example.test/api
          --build-arg VITE_SUPABASE_URL=https://project.supabase.co
          --build-arg VITE_SUPABASE_ANON_KEY=public-ci-placeholder
          --build-arg VITE_APP_VERSION="${{ github.event.pull_request.head.sha }}"
          --build-arg APP_VERSION="${{ github.event.pull_request.head.sha }}"
          -f apps/web/Dockerfile .

  release-origin:
    name: Release origin guard
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      # Without paid branch protection, a direct or force push to main must never publish or deploy.
      - name: Refuse force pushes
        if: github.event.forced
        run: |
          echo "::error::main was force-pushed; refusing to release."
          exit 1
      - name: Refuse commits that did not arrive through a merged develop or hotfix pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/verify-merged-pr.mjs --sha "$GITHUB_SHA" --base main --heads 'develop,hotfix/*'

  verify:
    name: Verify release commit
    needs: release-origin
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The merge commit on main is what ships; test it directly. This job holds no secrets.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:scripts
      - name: Build
        env:
          VITE_API_BASE_URL: http://127.0.0.1:3001
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-local-public-placeholder
        run: pnpm build

  publish:
    name: Build and publish immutable images
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Require public web build variables
        env:
          VITE_API_BASE_URL: ${{ vars.PRODUCTION_VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.PRODUCTION_VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.PRODUCTION_VITE_SUPABASE_ANON_KEY }}
        run: |
          for name in VITE_API_BASE_URL VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            [[ -n "${!name}" ]] || { echo "::error::Repository variable PRODUCTION_$name is not set."; exit 1; }
          done
      - name: Resolve lowercase GHCR namespace
        id: registry
        # Docker repository names must be lowercase; the GitHub owner may not be.
        run: echo "namespace=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: api
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.registry.outputs.namespace }}/ageniza-api:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - id: worker
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ steps.registry.outputs.namespace }}/ageniza-worker:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - id: web
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.registry.outputs.namespace }}/ageniza-web:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.PRODUCTION_VITE_API_BASE_URL }}
            VITE_SUPABASE_URL=${{ vars.PRODUCTION_VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.PRODUCTION_VITE_SUPABASE_ANON_KEY }}
            VITE_SENTRY_DSN=${{ vars.PRODUCTION_VITE_SENTRY_DSN }}
            VITE_APP_VERSION=${{ github.sha }}
            APP_VERSION=${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - id: migrations
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: infra/migrations/Dockerfile
          push: true
          tags: ${{ steps.registry.outputs.namespace }}/ageniza-migrations:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Record the immutable release manifest
        env:
          NAMESPACE: ${{ steps.registry.outputs.namespace }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          MIGRATIONS_DIGEST: ${{ steps.migrations.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          manifest="$RUNNER_TEMP/release/release.env"
          {
            echo "RELEASE=$GITHUB_SHA"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "API_IMAGE=$NAMESPACE/ageniza-api@$API_DIGEST"
            echo "WEB_IMAGE=$NAMESPACE/ageniza-web@$WEB_DIGEST"
            echo "WORKER_IMAGE=$NAMESPACE/ageniza-worker@$WORKER_DIGEST"
            echo "MIGRATIONS_IMAGE=$NAMESPACE/ageniza-migrations@$MIGRATIONS_DIGEST"
          } > "$manifest"
          while IFS='=' read -r key value; do
            case "$key" in *_IMAGE) node scripts/deploy/validate-image-ref.mjs "$key" "$value" ;; esac
          done < "$manifest"
          { echo "## Production release manifest"; echo '```'; cat "$manifest"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # The VPS downloads this artifact itself; digests are never taken from the SSH command.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-manifest
          path: ${{ runner.temp }}/release/release.env
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Migrate and deploy production
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PRODUCTION_PUBLIC_URL: ${{ vars.PRODUCTION_PUBLIC_URL }}
    # No application secret exists in GitHub: migrations, runtime configuration, and registry
    # credentials live on the VPS. This job holds only the forced-command SSH key.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Skip if main has moved past this commit
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$tip" == "$GITHUB_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is now at $tip; the newer run deploys it, not $GITHUB_SHA."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Require the public URL
        if: steps.tip.outputs.deploy == 'true'
        run: |
          [[ "$PRODUCTION_PUBLIC_URL" =~ ^https://[A-Za-z0-9.-]+$ ]] || { echo '::error::Variable PRODUCTION_PUBLIC_URL must be https://<domain> without a trailing slash.'; exit 1; }
      - if: steps.tip.outputs.deploy == 'true'
        uses: ./.github/actions/production-ssh
        with:
          private-key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          host: ${{ vars.PRODUCTION_SSH_HOST }}
          port: ${{ vars.PRODUCTION_SSH_PORT }}
          user: ${{ vars.PRODUCTION_SSH_USER }}
      - name: Verify, migrate, and activate the release on the VPS
        if: steps.tip.outputs.deploy == 'true'
        run: ssh production "apply $GITHUB_SHA $GITHUB_RUN_ID"
      - name: Smoke test the served version through Cloudflare
        if: steps.tip.outputs.deploy == 'true'
        run: |
          served="$(curl --fail --silent --show-error --proto '=https' --retry 3 --retry-all-errors --max-time 20 "$PRODUCTION_PUBLIC_URL/version.txt?run=$GITHUB_RUN_ID" | tr -d '[:space:]')"
          [[ "$served" == "$GITHUB_SHA" ]] || { echo "::error::The public site serves '$served', expected $GITHUB_SHA."; exit 1; }
          curl --fail --silent --show-error --proto '=https' --retry 3 --retry-all-errors --max-time 20 "$PRODUCTION_PUBLIC_URL/api/health" >/dev/null
      - name: Roll back if this release went live but failed
        if: failure() && steps.tip.outputs.deploy == 'true'
        run: |
          active="$(ssh production status 2>/dev/null | sed -n 's/^RELEASE=//p')" || true
          if [[ "$active" == "$GITHUB_SHA" ]]; then
            ssh production rollback
          else
            echo "::notice::Active release is '${active:-unknown}', not $GITHUB_SHA; no rollback needed."
          fi
