name: CI

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  branch-route:
    name: Branch route
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate the pull-request route
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$BASE_REF" in
            develop)
              echo "Integration pull request: $HEAD_REF -> develop"
              ;;
            main)
              if [[ "$HEAD_REF" != "develop" && "$HEAD_REF" != hotfix/* ]]; then
                echo "Pull requests to main must come from develop or hotfix/*; got $HEAD_REF." >&2
                exit 1
              fi
              echo "Production-promotion pull request: $HEAD_REF -> main"
              ;;
            *)
              echo "Unexpected protected target branch: $BASE_REF" >&2
              exit 1
              ;;
          esac

  migration-policy:
    name: Migration policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate migration changes
        run: >-
          node scripts/ci/validate-migrations.mjs
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The default pull_request checkout is the merge result, which is what actually lands.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable the repository-pinned pnpm with Corepack
        run: corepack enable
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Install from the committed lockfile
        run: pnpm install --frozen-lockfile
      - name: Run root lint gate
        run: pnpm lint
      - name: Run root typecheck gate
        run: pnpm typecheck
      - name: Run root test gate
        run: pnpm test
      - name: Run repository script tests
        run: pnpm test:scripts
      - name: Run root build gate
        env:
          VITE_API_BASE_URL: http://127.0.0.1:3001
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-local-public-placeholder
        run: pnpm build

  docker-images:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate the local Compose model
        run: docker compose config --quiet
      - name: Build all application runtime images
        run: docker compose build
      - name: Build the production migration runner
        run: docker build -t ageniza-migrations:ci -f infra/migrations/Dockerfile .
      - name: Check the migration runner entrypoint
        run: docker run --rm --entrypoint node ageniza-migrations:ci -e "import('knex').then(() => console.log('migration runner ok'))"
      - name: Validate the production Caddyfile syntax
        run: |
          edge="$RUNNER_TEMP/caddy"
          mkdir -p "$edge"
          cp infra/vps/caddy/Caddyfile "$edge/Caddyfile"
          echo 'trusted_proxies static 173.245.48.0/20 2400:cb00::/32' > "$edge/cloudflare-trusted-proxies.caddy"
          docker run --rm -e AGENIZA_DOMAIN=app.example.test -e AGENIZA_ACME_EMAIL=ops@example.test -v "$edge:/etc/caddy:ro" caddy:2 \
            caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null

  database-local:
    name: PostgreSQL local database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The default pull_request checkout is the merge result, which is what actually lands.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable the repository-pinned pnpm with Corepack
        run: corepack enable
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Install from the committed lockfile
        run: pnpm install --frozen-lockfile
      - name: Start the isolated local PostgreSQL
        run: pnpm db:start
      - name: Apply every migration to an empty database
        run: pnpm db:migrate
      - name: Run database integration and RLS isolation suite
        run: pnpm db:test:local
      - name: Remove the local database
        if: always()
        run: docker compose down --volumes --remove-orphans
