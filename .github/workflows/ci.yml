name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  # A pull request validates the merge result; this validates what actually landed
  # on develop once it did, so two merges in a row cannot pass in isolation and
  # break the branch. It reuses the same jobs as the pull-request run.
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A pull request only needs its newest run; every commit that lands on develop needs its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  branch-route:
    name: Branch route
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # A bad pin in a rarely-run workflow only shows up on release day; resolve them all here.
      - name: Validate pinned action references
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/validate-action-pins.mjs
      - name: Validate the pull-request route
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$BASE_REF" in
            develop)
              echo "Integration pull request: $HEAD_REF -> develop"
              ;;
            main)
              if [[ "$HEAD_REF" != "develop" && "$HEAD_REF" != hotfix/* ]]; then
                echo "Pull requests to main must come from develop or hotfix/*; got $HEAD_REF." >&2
                exit 1
              fi
              echo "Production-promotion pull request: $HEAD_REF -> main"
              ;;
            *)
              echo "Unexpected protected target branch: $BASE_REF" >&2
              exit 1
              ;;
          esac

  migration-policy:
    name: Migration policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate migration changes
        run: >-
          node scripts/ci/validate-migrations.mjs
          --base "${{ github.event.pull_request.base.sha || github.event.before }}"
          --head "${{ github.event.pull_request.head.sha || github.sha }}"
      # docs/business/structural-changes.md asks for the decision to be recorded before the change.
      # This is what makes that hold for anyone, agent or person.
      - name: Require a recorded decision for a structural migration
        run: >-
          node scripts/ci/verify-structural-decisions.mjs
          --base "${{ github.event.pull_request.base.sha || github.event.before }}"
          --head "${{ github.event.pull_request.head.sha || github.sha }}"

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The default pull_request checkout is the merge result, which is what actually lands.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable the repository-pinned pnpm with Corepack
        run: corepack enable
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Install from the committed lockfile
        run: pnpm install --frozen-lockfile
      - name: Run root lint gate
        run: pnpm lint
      - name: Run root typecheck gate
        run: pnpm typecheck
      - name: Run root test gate
        run: pnpm test
      - name: Run repository script tests
        run: pnpm test:scripts
      - name: Run root build gate
        env:
          VITE_API_BASE_URL: http://127.0.0.1:3001
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-local-public-placeholder
        run: pnpm build
      # The .pnpmfile.cjs hook keeps the vitest chain out of `pnpm deploy --prod` (issue #281); this
      # fails if it comes back, if the image carries more than the runtime reads, or if the deployed
      # dist does not load (issue #305). It runs after the build because the deploy ships dist.
      - name: Verify the API production closure
        run: node scripts/ci/verify-api-production-closure.mjs
      # docs/api is generated from packages/contracts; a route or schema change that forgets to
      # regenerate it fails here instead of shipping stale documentation (issue #182).
      - name: Verify the generated API documentation is current
        run: |
          pnpm api:docs
          # Content-based on purpose: `git status` can report a stat-dirty file whose bytes match
          # the index (racy timestamp right after checkout), which would fail this check falsely.
          if ! git diff --exit-code -- docs/api || [ -n "$(git ls-files --others --exclude-standard -- docs/api)" ]; then
            echo 'docs/api is stale; run pnpm api:docs and commit the result.' >&2
            git --no-pager diff -- docs/api
            exit 1
          fi

  docker-images:
    name: Docker images
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate the local Compose model
        run: docker compose config --quiet
      - name: Build all application runtime images
        run: docker compose build
      - name: Build the production migration runner
        run: docker build -t ageniza-migrations:ci -f infra/migrations/Dockerfile .
      - name: Check the migration runner entrypoint
        run: docker run --rm --entrypoint node ageniza-migrations:ci -e "import('knex').then(() => console.log('migration runner ok'))"
      - name: Lint the VPS shell scripts
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo koalaman/shellcheck:stable
          --severity=warning infra/vps/*.sh infra/postgres/initdb/*.sh
      # Renders the production model on every pull request; without this only PRs to main check it.
      - name: Render and check the production Compose model
        run: node scripts/deploy/validate-production.mjs
      - name: Validate the tunnel ingress rules
        run: |
          edge="$RUNNER_TEMP/cloudflared"
          mkdir -p "$edge"
          cp infra/vps/cloudflared/config.yml "$edge/config.yml"
          # Credentials are a host secret; ingress validation does not need them.
          echo '{}' > "$edge/credentials.json"
          docker run --rm -v "$edge:/etc/cloudflared:ro" cloudflare/cloudflared:latest \
            tunnel --config /etc/cloudflared/config.yml ingress validate
      # Same rendering as the dev installer: the two Access values are filled in, the rest is the committed file.
      - name: Render and check the dev Compose model
        run: node scripts/deploy/validate-dev.mjs
      - name: Validate the dev tunnel ingress rules
        run: |
          edge="$RUNNER_TEMP/cloudflared-dev"
          mkdir -p "$edge"
          sed -e 's/REPLACE_WITH_ACCESS_TEAM_NAME/ci-team/' -e "s/REPLACE_WITH_ACCESS_AUD_TAG/$(printf 'ab%.0s' {1..32})/" \
            infra/vps/cloudflared/dev-config.yml > "$edge/config.yml"
          echo '{}' > "$edge/credentials.json"
          run() { docker run --rm -v "$edge:/etc/cloudflared:ro" cloudflare/cloudflared:latest tunnel --config /etc/cloudflared/config.yml ingress "$@"; }
          run validate
          run rule https://dev.ageniza.com.br/api/health | grep -F 'service: http://web:8080'
          run rule https://mail-dev.ageniza.com.br/ | grep -F 'service: http://mailpit:8025'
          run rule https://anything-else.ageniza.com.br/ | grep -F 'service: http_status:404'
      - name: Validate the web server configuration
        run: |
          docker run --rm -v "$PWD/apps/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginxinc/nginx-unprivileged:1.27-alpine nginx -t

  database-local:
    name: PostgreSQL local database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The test harnesses have no default database and refuse the one named `ageniza` (issue #391), so
    # the job creates its own and points every command at it. Throwaway credentials, same as compose.yml.
    env:
      DATABASE_URL: postgresql://ageniza_app:ageniza_app@127.0.0.1:54322/ageniza_ci
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/ageniza_ci
    steps:
      # The default pull_request checkout is the merge result, which is what actually lands. The whole history is
      # fetched so the decision below can diff the pull request's base against its head.
      - name: Check out the repository with its history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Issue #789: a pull request whose every changed file is on a fixed allow list (apps/web, docs, root Markdown)
      # cannot reach the database, the API or the worker, so the ~14 minute steps below are skipped. The job itself stays
      # unconditional: a skipped job reads as "skipped", this one stays "completed" and says why. Every step below is
      # gated on `!= 'false'`, so a decision that failed to produce its output runs the job instead of skipping it.
      # The rule and the list live in scripts/ci/decide-database-job.mjs and docs/ci/README.md.
      - name: Decide whether the database job is needed
        id: area
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/decide-database-job.mjs --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Say why the database job was skipped
        if: steps.area.outputs.run == 'false'
        env:
          REASON: ${{ steps.area.outputs.reason }}
        run: |
          echo "Skipped: $REASON."
          echo "Skipped: $REASON." >> "$GITHUB_STEP_SUMMARY"
      - name: Enable the repository-pinned pnpm with Corepack
        if: steps.area.outputs.run != 'false'
        run: corepack enable
      - name: Resolve pnpm store path
        if: steps.area.outputs.run != 'false'
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.area.outputs.run != 'false'
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Install from the committed lockfile
        if: steps.area.outputs.run != 'false'
        run: pnpm install --frozen-lockfile
      - name: Start the isolated local PostgreSQL
        if: steps.area.outputs.run != 'false'
        run: pnpm db:start
      - name: Create the database the suites run against
        if: steps.area.outputs.run != 'false'
        run: docker compose exec -T postgres psql -U postgres -v ON_ERROR_STOP=1 -c 'create database ageniza_ci'
      - name: Apply every migration to an empty database
        if: steps.area.outputs.run != 'false'
        run: pnpm db:migrate
      - name: Run database integration and RLS isolation suite
        if: steps.area.outputs.run != 'false'
        run: pnpm db:test:local
      - name: Start the local object storage
        if: steps.area.outputs.run != 'false'
        run: pnpm storage:start
      # The worker image ships ffmpeg, but this job runs the suite on the runner, not in that image.
      # The media tests exercise real ffmpeg/ffprobe on purpose, so the runner needs it too. A pinned static
      # build is cached per version: apt-get from the runner's mirror stalled this job (issue #735).
      - name: Restore the cached ffmpeg
        if: steps.area.outputs.run != 'false'
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-static
          key: ${{ runner.os }}-ffmpeg-7.0.2-abda8d77ce83
      - name: Install ffmpeg for the media processing suite
        if: steps.area.outputs.run != 'false' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        env:
          FFMPEG_SHA256: abda8d77ce8309141f83ab8edf0596834087c52467f6badf376a6a2a4c87cf67
        run: |
          curl -fsSL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180             -o "$RUNNER_TEMP/ffmpeg.tar.xz" https://johnvansickle.com/ffmpeg/releases/ffmpeg-7.0.2-amd64-static.tar.xz
          echo "$FFMPEG_SHA256  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum --check --strict
          mkdir -p ~/ffmpeg-static
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C ~/ffmpeg-static --strip-components=1             ffmpeg-7.0.2-amd64-static/ffmpeg ffmpeg-7.0.2-amd64-static/ffprobe
      - name: Put ffmpeg on the PATH
        if: steps.area.outputs.run != 'false'
        run: |
          echo "$HOME/ffmpeg-static" >> "$GITHUB_PATH"
          "$HOME/ffmpeg-static/ffmpeg" -version | head -1
          "$HOME/ffmpeg-static/ffprobe" -version | head -1
      - name: Build the worker's workspace dependencies
        if: steps.area.outputs.run != 'false'
        run: pnpm exec turbo run build --filter=@ageniza/worker^...
      - name: Run the durable job queue suite as the application role
        if: steps.area.outputs.run != 'false'
        run: pnpm --filter @ageniza/worker test:integration
      - name: Build the API's workspace dependencies
        if: steps.area.outputs.run != 'false'
        run: pnpm exec turbo run build --filter=@ageniza/api^...
      - name: Run the authentication suite as the application role
        if: steps.area.outputs.run != 'false'
        run: pnpm --filter @ageniza/api test:integration
      - name: Remove the local database
        if: always() && steps.area.outputs.run != 'false'
        run: docker compose down --volumes --remove-orphans
