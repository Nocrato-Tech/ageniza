# Cloudflare Tunnel sends every public request here (ADR 0012): this server serves the SPA and
# proxies /api to the API, so the browser and the API share one origin.
# CF-Connecting-IP is trusted because Cloudflare overwrites it on ingress and this port is
# reachable only from the tunnel network; anything already inside that network could forge it.
map $http_cf_connecting_ip $ageniza_client_ip {
  ""      $remote_addr;
  default $http_cf_connecting_ip;
}

limit_conn_zone $ageniza_client_ip zone=ageniza_api_connections:1m;
limit_conn_zone $ageniza_client_ip zone=ageniza_photo_connections:1m;

server {
  listen 8080;
  server_name _;
  # Redirects stay relative: the tunnel terminates TLS, so an absolute Location would carry this port and the internal scheme.
  absolute_redirect off;
  root /usr/share/nginx/html;
  # Docker's embedded DNS, re-resolved so a redeployed API container is picked up.
  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 1m;
  limit_conn_status 429;

  # Identity images arrive as base64 JSON; only these routes get the transport overhead.
  location ~ "^/api/(me/photo|agencies/[0-9a-fA-F-]{36}/clients/[0-9a-fA-F-]{36}/photo)$" {
    client_max_body_size 14m;
    limit_conn ageniza_api_connections 16;
    limit_conn ageniza_photo_connections 2;
    include /etc/nginx/ageniza-api-proxy.inc;
  }

  # Nothing embeds this app (no iframe in the web app or the mobile export), so framing is refused outright. An add_header
  # inside a location replaces every inherited one, so the SPA locations repeat the set instead of inheriting it, and the
  # proxied /api/ keeps the headers its own server sends.
  location = /health { access_log off; default_type text/plain; return 200 'ok'; }
  location = /version.txt {
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location /api/ {
    limit_conn ageniza_api_connections 16;
    include /etc/nginx/ageniza-api-proxy.inc;
  }

  location = /app-mobile { return 308 /app-mobile/; }
  location ^~ /app-mobile/ {
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ =404;
  }

  location / {
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ /index.html;
  }
}
