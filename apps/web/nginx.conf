# Cloudflare Tunnel sends every public request here (ADR 0012): this server serves the SPA and
# proxies /api to the API, so the browser and the API share one origin.
# CF-Connecting-IP is trusted because Cloudflare overwrites it on ingress and this port is
# reachable only from the tunnel network; anything already inside that network could forge it.
map $http_cf_connecting_ip $ageniza_client_ip {
  ""      $remote_addr;
  default $http_cf_connecting_ip;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  # Docker's embedded DNS, re-resolved so a redeployed API container is picked up.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location = /health { access_log off; default_type text/plain; return 200 'ok'; }
  location = /version.txt { access_log off; add_header Cache-Control "no-store" always; }

  location /api/ {
    # A variable upstream keeps nginx from caching the container IP at startup; with a variable
    # the location prefix is not stripped automatically, so rewrite it explicitly.
    set $ageniza_api http://api:3001;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $ageniza_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $ageniza_client_ip;
    proxy_set_header X-Request-Id $http_x_request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  location / { try_files $uri $uri/ /index.html; }
}
